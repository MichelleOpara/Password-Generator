<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="randomizer.css">
</head>
<body>
    <main>
         <header> 
        <div>
            <h1>Generate a</h1>
            <h3>RANDOM PASSWORD</h3>
            <p>Keep your accouts secure at all times</p> 
        </div>
    </header>
   
    <div id="form">
        <h1 id="text">RaNdOmIzEr</h1>
        <hr>
        <div id="toggle">
            <label for="uppercase">
                <input type="checkbox" id="uppercase" checked> Uppercase (A-Z)
            </label><br>
             <label for="lowercase">
                <input type="checkbox" id="lowercase" checked> Lowercase (a-z)
            </label><br>
             <label for="numbers">
                <input type="checkbox" id="numbers" checked> Numbers (0-9)
            </label><br>
             <label for="symbols">
                <input type="checkbox" id="symbols" checked> Symbols (@#$*)
            </label>
        </div>
        <label for="range">
            <input type="range" id="range" min="7" max="20" value="8"> 
            <p id="length">Length: 8</p>
        </label>
        <button id="password-btn" onclick="generatePassword()">GENERATE PASSWORD</button>
        <div id="passwords">
            <p id="Pswrd_one">Password 1</p>
            <p id="Pswrd_two">Password 2</p> 
        </div>
        <div id="copy">
            <i class="fa-regular fa-copy" onclick="copyOne()"></i>          
            <i class="fa-regular fa-copy" onclick="copyTwo()"></i>
        </div>
    </div>
    <script src="randomizer.js"></script>
    </main>
</body>
</html>
